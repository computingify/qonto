<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qonto Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0e27;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 13px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card {
            background: #151a2f;
            border: 1px solid #1e2749;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 16px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            border-color: #2a3a5a;
            box-shadow: 0 8px 24px rgba(0, 212, 255, 0.1);
        }

        .section-title {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #00d4ff;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 4px;
            background: #00d4ff;
            border-radius: 50%;
        }

        .controls {
            display: flex;
            gap: 12px;
        }

        button {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-start {
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            color: #0a0e27;
        }

        .btn-start:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(0, 212, 255, 0.3);
        }

        .btn-start:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-stop {
            background: linear-gradient(135deg, #ff4757, #ff1744);
            color: white;
        }

        .btn-stop:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(255, 23, 68, 0.3);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .toggle-wrapper {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .toggle {
            position: relative;
            width: 50px;
            height: 28px;
            background: #1e2749;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .toggle input {
            display: none;
        }

        .toggle-circle {
            position: absolute;
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: all 0.3s;
        }

        .toggle input:checked + .toggle-circle {
            transform: translateX(22px);
        }

        .toggle input:checked ~ .toggle {
            background: #00d4ff;
        }

        .toggle-label {
            font-size: 14px;
            font-weight: 500;
            color: #e0e0e0;
        }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background: #0f1424;
            border-radius: 8px;
            font-size: 13px;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #666;
            transition: all 0.3s;
        }

        .status-indicator.running {
            background: #00ff88;
            box-shadow: 0 0 10px #00ff88;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .logs-container {
            background: #0f1424;
            border: 1px solid #1e2749;
            border-radius: 8px;
            padding: 16px;
            height: 280px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.6;
        }

        .log-line {
            color: #00d4ff;
            margin-bottom: 6px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .log-line.auto {
            color: #00ff88;
        }

        .log-line.error {
            color: #ff4757;
        }

        .log-line.info {
            color: #ffd700;
        }

        .logs-container::-webkit-scrollbar {
            width: 5px;
        }

        .logs-container::-webkit-scrollbar-track {
            background: #0a0e27;
        }

        .logs-container::-webkit-scrollbar-thumb {
            background: #00d4ff;
            border-radius: 3px;
        }

        .logs-container::-webkit-scrollbar-thumb:hover {
            background: #0099ff;
        }

        .question-box {
            background: #1a3a2a;
            border: 1.5px solid #00d4a0;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .question-box.hidden {
            display: none;
        }

        .question-text {
            font-size: 14px;
            color: #00ff88;
            margin-bottom: 14px;
            font-weight: 500;
        }

        .question-input {
            width: 100%;
            padding: 10px 12px;
            background: #0f1424;
            border: 1px solid #00d4a0;
            border-radius: 6px;
            color: #e0e0e0;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            margin-bottom: 12px;
            transition: all 0.3s;
        }

        .question-input:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
        }

        .question-buttons {
            display: flex;
            gap: 8px;
        }

        .question-buttons button {
            flex: 1;
            padding: 10px;
            font-size: 12px;
        }

        .btn-yes {
            background: linear-gradient(135deg, #00ff88, #00d4a0);
            color: #0a0e27;
        }

        .btn-yes:hover {
            box-shadow: 0 8px 16px rgba(0, 255, 136, 0.3);
        }

        .btn-no {
            background: #2a3a5a;
            color: #888;
            border: 1px solid #1e2749;
        }

        .btn-no:hover {
            background: #3a4a6a;
            color: #e0e0e0;
        }

        /* Styles pour la mise en page (sur une seule ligne) */
        .status-container {
            display: flex;
            align-items: center;
            background: #0f1424;
            border-radius: 8px;
            font-size: 13px;
            justify-content: space-between; 
            width: 100%;
            padding: 0 13px;
        }

        /* Style pour l'affichage de chaque société (rond + nom) */
        .company-status {
            display: flex;
            align-items: center;
            gap: 8px; /* Espace entre le rond et le nom */
            font-family: Arial, sans-serif;
        }

        /* Style par défaut du rond (gris = en attente) */
        .status-circle {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background-color: gray;
            flex-shrink: 0;
            transition: background-color 0.3s, box-shadow 0.3s;
        }

        /* Un traitement est en cours pour cette société */
        .status-circle.status-running {
            background-color: #00d4ff;
            box-shadow: 0 0 10px #00d4ff;
            animation: pulse 1s infinite;
        }

        /* Tout s'est bien passé */
        .status-circle.status-ok {
            background-color: rgb(30, 227, 30);
            box-shadow: 0 0 8px rgba(30, 227, 30, 0.6);
        }

        /* Le zip est produit mais quelque chose mérite un contrôle */
        .status-circle.status-warn {
            background-color: #ffb020;
            box-shadow: 0 0 8px rgba(255, 176, 32, 0.6);
        }

        /* Échec : le zip est incomplet ou absent */
        .status-circle.status-error {
            background-color: #ff4757;
            box-shadow: 0 0 10px rgba(255, 71, 87, 0.7);
        }

        .company-status.has-issue {
            cursor: help;
        }

        .company-status.status-error > span:last-child {
            color: #ff6b78;
            font-weight: 600;
        }

        .company-status.status-warn > span:last-child {
            color: #ffb020;
            font-weight: 600;
        }

        /* Panneau détaillant la cause de chaque problème */
        .issues-card.hidden {
            display: none;
        }

        .issue-group {
            border-left: 3px solid #ff4757;
            padding: 10px 0 10px 12px;
            margin-bottom: 12px;
            background: #1c1220;
            border-radius: 0 6px 6px 0;
        }

        .issue-group:last-child {
            margin-bottom: 0;
        }

        .issue-group.warn {
            border-left-color: #ffb020;
            background: #1e1a11;
        }

        .issue-society {
            font-size: 13px;
            font-weight: 600;
            color: #ff6b78;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .issue-group.warn .issue-society {
            color: #ffb020;
        }

        .issue-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .issue-list li {
            font-size: 12px;
            line-height: 1.5;
            color: #d8d8d8;
            padding-left: 14px;
            position: relative;
            word-break: break-word;
        }

        .issue-list li::before {
            content: '›';
            position: absolute;
            left: 0;
            color: #888;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 24px;
            }

            .container {
                max-width: 100%;
            }

            .controls {
                flex-direction: column;
            }

            .logs-container {
                height: 240px;
            }
        }

        /* --- Spec 001 : mois à générer, ligne Amazon, décision Amazon --- */
        .month-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; font-size: 13px; color: #9aa3c0; }
        .month-row select { font: inherit; font-size: 14px; color: #e0e0e0; background: #0f1424; border: 1px solid #1e2749; border-radius: 8px; padding: 8px 10px; min-width: 210px; }
        .month-row select:focus-visible { outline: 2px solid #00d4ff; outline-offset: 2px; }
        .month-msg { font-size: 13px; color: #ff5c6c; margin: -4px 0 12px; }
        .month-msg:empty { display: none; }
        .btn-start[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
        .amz-lines { margin-top: 14px; padding-top: 12px; border-top: 1px solid #1e2749; font-size: 13px; color: #9aa3c0; font-variant-numeric: tabular-nums; }
        .amz-lines:empty { display: none; }
        .amz-lines div + div { margin-top: 4px; }
        .amz-lines b { color: #e0e0e0; font-weight: 600; }
        .decision-card { border-color: #2f6fb3; box-shadow: 0 10px 28px -14px rgba(0, 0, 0, .6); }
        .decision-card.hidden { display: none; }
        .d-intro { font-size: 13px; color: #9aa3c0; margin: -4px 0 8px; }
        .tx { border-top: 1px solid #1e2749; padding: 14px 10px; margin: 0 -10px; border-radius: 6px; transition: background-color .2s; }
        .tx.missing { background: rgba(255, 92, 108, .08); }
        .tx.missing .amt::after { content: " · choix manquant"; font-size: 12px; font-weight: 600; color: #ff5c6c; }
        .tx-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
        .amt { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
        .tx-date { color: #9aa3c0; font-size: 13px; font-variant-numeric: tabular-nums; }
        .tx-order { font: 12px ui-monospace, Menlo, monospace; color: #9aa3c0; margin-top: 2px; }
        .tx-cause { margin-top: 8px; font-size: 13px; color: #ffad33; }
        .tx-cause.missing { color: #ff5c6c; }
        .tx-links { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 6px; font-size: 13px; }
        .tx-links a, .issue-list a { color: #00d4ff; text-underline-offset: 3px; }
        .tx-choices { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
        .tx-choices button { background: #1c2340; color: #e0e0e0; border: 1px solid #1e2749; padding: 8px 11px; font-weight: 500; font-size: 13px; text-transform: none; letter-spacing: 0; }
        .tx-choices button[aria-pressed="true"] { background: #0f3a63; border-color: #00d4ff; color: #fff; }
        .d-foot { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
        .btn-decide { background: #22d39a; color: #062a1d; white-space: nowrap; flex: none; }
        .btn-decide[aria-disabled="true"] { opacity: .45; }
        .d-refuse { font-size: 13px; color: #ff5c6c; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ QONTO</h1>
            <p>Transaction Manager</p>
        </div>

        <!-- Boutons de contrôle -->
        <div class="card">
            <div class="section-title">Contrôles</div>
            <label class="month-row"><span>Mois à générer</span><select id="monthSelect"></select></label>
            <p class="month-msg" id="monthMsg" role="alert"></p>
            <div class="controls">
                <button class="btn-start" id="startBtn" onclick="startScript()">▶ Démarrer</button>
                <button class="btn-stop" id="stopBtn" onclick="stopScript()" disabled>⏹ Arrêter</button>
            </div>
        </div>

        <!-- Status -->
        <div class="card">
            <div class="status-bar">
                <div class="status-indicator" id="statusDot"></div>
                <span id="statusText">● Inactif</span>
            </div>

            <div class="status-container">
                <div class="company-status">
                    <span id="adn-dev-status" class="status-circle"></span>
                    <span>ADN-Dev</span>
                </div>

                <div class="company-status">
                    <span id="adn-group-status" class="status-circle"></span>
                    <span>ADN-Group</span>
                </div>
                
                <div class="company-status">
                    <span id="solio-status" class="status-circle"></span>
                    <span>Solio</span>
                </div>
            </div>
            <div class="amz-lines" id="amzLines" aria-live="polite"></div>
        </div>

        <!-- Décision Amazon (spec 001) -->
        <section class="card decision-card hidden" id="decisionCard" aria-labelledby="decisionTitle">
            <div class="section-title" id="decisionTitle">Décision Amazon</div>
            <p class="d-intro" id="decisionIntro"></p>
            <div id="decisionList"></div>
            <div class="d-foot">
                <button class="btn-decide" id="decideBtn" aria-disabled="true">Valider et continuer</button>
                <span class="d-refuse" id="decisionRefuse" role="alert"></span>
            </div>
        </section>

        <!-- Problèmes détectés -->
        <div class="card issues-card hidden" id="issuesCard">
            <div class="section-title" id="issuesTitle">Problèmes détectés</div>
            <div id="issuesList"></div>
        </div>

        <!-- Logs -->
        <div class="card">
            <div class="section-title">Logs</div>
            <div class="logs-container" id="logsContainer"></div>
        </div>
    </div>

    <script>
        let isRunning = false;
        const pollInterval = 300;

        // --- Maintien en vie / fermeture automatique de l'application ---
        // Battement de cœur régulier : tant que la page est ouverte, le
        // serveur reste vivant.
        function heartbeat() {
            fetch('/api/heartbeat', { method: 'POST' }).catch(() => {});
        }
        heartbeat();
        setInterval(heartbeat, 5000);
        // Battement immédiat au retour sur l'onglet (après mise en veille).
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') heartbeat();
        });
        // Fermeture de l'onglet -> arrêt immédiat de l'application.
        window.addEventListener('pagehide', () => {
            navigator.sendBeacon('/api/quit');
        });

        // --- Mois à générer (spec 001, F6) ---
        // 12 derniers mois + le mois en cours, refusé (A6) : le relevé Qonto
        // d'un mois n'est publié qu'au début du mois suivant.
        const MONTHS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
        const monthSelect = document.getElementById('monthSelect');
        (function buildMonths() {
            const now = new Date();
            for (let i = 0; i <= 12; i++) {
                const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                const option = document.createElement('option');
                option.value = d.getFullYear() + '_' + String(d.getMonth() + 1).padStart(2, '0');
                option.textContent = MONTHS[d.getMonth()] + ' ' + d.getFullYear() + (i === 0 ? ' (en cours)' : '');
                if (i === 1) option.selected = true;
                monthSelect.appendChild(option);
            }
        })();
        const monthLabel = () => monthSelect.selectedOptions[0].textContent.replace(' (en cours)', '');
        const isCurrentMonth = () => monthSelect.selectedIndex === 0;
        function checkMonth() {
            document.getElementById('startBtn').setAttribute('aria-disabled', String(isCurrentMonth()));
            document.getElementById('monthMsg').textContent = isCurrentMonth()
                ? `Impossible de générer ${monthLabel()} : le relevé Qonto du mois n'est publié qu'au début du mois suivant.`
                : '';
        }
        monthSelect.addEventListener('change', checkMonth);

        async function startScript() {
            if (isCurrentMonth()) { checkMonth(); monthSelect.focus(); return; }
            try {
                const response = await fetch('/api/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ auto: true, month: monthSelect.value })
                });
                if (!response.ok) {
                    const data = await response.json().catch(() => ({}));
                    document.getElementById('monthMsg').textContent = data.error || 'Démarrage refusé';
                    return;
                }
                document.getElementById('amzLines').innerHTML = '';
                hideDecision();
                isRunning = true;
                applyStatuses({});
                document.getElementById('logsContainer').innerHTML = '';
                updateUI();
                poll();
            } catch (err) {
                console.error('Erreur:', err);
            }
        }

        async function stopScript() {
            try {
                await fetch('/api/stop', { method: 'POST' });
                isRunning = false;
                updateUI();
                poll();
            } catch (err) {
                console.error('Erreur:', err);
            }
        }

        async function poll() {
            try {
                const response = await fetch('/api/logs');
                const data = await response.json();
                const container = document.getElementById('logsContainer');
                
                data.logs.forEach(log => {
                    const line = document.createElement('div');
                    line.className = 'log-line';

                    if (log.includes('✗') || log.startsWith('[ERREUR]')) line.classList.add('error');
                    else if (log.startsWith('[ATTENTION]') || log.includes('?')) line.classList.add('info');

                    line.textContent = log;
                    container.appendChild(line);
                });

                if (data.logs.length > 0) container.scrollTop = container.scrollHeight;

                applyStatuses(data.statuses || {});
                renderAmazon(data.amazon || {});
                renderDecision(data.decision);

                isRunning = data.running;
                updateUI();

                if (isRunning) setTimeout(poll, pollInterval);
            } catch (err) {
                if (isRunning) setTimeout(poll, pollInterval);
            }
        }

        // Les sociétés suivies, dans l'ordre de traitement du script.
        const SOCIETIES = {
            'adn-dev': 'ADN-Dev',
            'adn-group': 'ADN-Group',
            'solio': 'Solio'
        };

        const LEVEL_CLASSES = ['status-running', 'status-ok', 'status-warn', 'status-error'];

        // Applique l'état renvoyé par le serveur : couleur de la pastille et
        // panneau détaillant la cause exacte de chaque problème.
        function applyStatuses(statuses) {
            Object.keys(SOCIETIES).forEach(society => {
                const state = statuses[society];
                const circle = document.getElementById(society + '-status');
                const row = circle ? circle.parentElement : null;
                if (!circle) return;

                circle.classList.remove(...LEVEL_CLASSES);
                if (row) row.classList.remove('status-warn', 'status-error', 'has-issue');

                if (!state) {
                    circle.title = 'En attente';
                    return;
                }

                const level = state.level;
                if (level !== 'pending') circle.classList.add('status-' + level);

                const messages = state.messages || [];
                if (level === 'error' || level === 'warn') {
                    if (row) row.classList.add('status-' + level, 'has-issue');
                    circle.title = messages.join('\n');
                } else {
                    circle.title = level === 'ok' ? 'Terminé sans problème'
                                 : level === 'running' ? 'Traitement en cours…'
                                 : 'En attente';
                }
            });

            renderIssues(statuses);
        }

        // Liste lisible des problèmes, société par société.
        function renderIssues(statuses) {
            const card = document.getElementById('issuesCard');
            const list = document.getElementById('issuesList');
            const title = document.getElementById('issuesTitle');

            const groups = [];
            // Les problèmes généraux (Gmail, date...) d'abord, puis les sociétés.
            const order = ['_global_'].concat(Object.keys(SOCIETIES));
            order.forEach(key => {
                const state = statuses[key];
                if (!state || !state.messages || !state.messages.length) return;
                if (state.level !== 'error' && state.level !== 'warn') return;
                groups.push({
                    name: key === '_global_' ? 'Général' : (SOCIETIES[key] || key),
                    level: state.level,
                    messages: state.messages
                });
            });

            list.innerHTML = '';
            if (!groups.length) {
                card.classList.add('hidden');
                return;
            }

            const errorCount = groups.filter(g => g.level === 'error').length;
            title.textContent = errorCount
                ? `Problèmes détectés (${errorCount} société(s) en échec)`
                : 'Points à vérifier';

            groups.forEach(group => {
                const block = document.createElement('div');
                block.className = 'issue-group' + (group.level === 'warn' ? ' warn' : '');

                const head = document.createElement('div');
                head.className = 'issue-society';
                head.textContent = (group.level === 'error' ? '✗ ' : '⚠ ') + group.name;
                block.appendChild(head);

                const ul = document.createElement('ul');
                ul.className = 'issue-list';
                group.messages.forEach(message => {
                    const li = document.createElement('li');
                    appendLinked(li, message);
                    ul.appendChild(li);
                });
                block.appendChild(ul);

                list.appendChild(block);
            });

            card.classList.remove('hidden');
        }

        // Texte avec liens cliquables (les problèmes Amazon portent l'URL de la commande).
        function appendLinked(parent, text) {
            text.split(/(https:\/\/\S+)/).forEach(part => {
                if (/^https:\/\//.test(part)) {
                    const a = document.createElement('a');
                    a.href = part; a.target = '_blank'; a.rel = 'noopener';
                    a.textContent = part.includes('order-details') ? 'voir la commande sur Amazon' : part;
                    parent.appendChild(a);
                } else {
                    parent.appendChild(document.createTextNode(part));
                }
            });
        }

        // --- Ligne « Amazon » par société ---
        function renderAmazon(amazon) {
            const box = document.getElementById('amzLines');
            box.innerHTML = '';
            Object.keys(SOCIETIES).forEach(society => {
                if (!amazon[society]) return;
                const line = document.createElement('div');
                line.append('Amazon · ' + SOCIETIES[society] + ' : ');
                const b = document.createElement('b');
                b.textContent = amazon[society];
                line.appendChild(b);
                box.appendChild(line);
            });
        }

        // --- Carte « Décision Amazon » (spec 001, F3/F5) ---
        let shownDecision = null;
        const answers = {};

        function hideDecision() {
            shownDecision = null;
            document.getElementById('decisionCard').classList.add('hidden');
        }

        function renderDecision(pending) {
            if (!pending) { if (shownDecision) hideDecision(); return; }
            if (shownDecision === pending.id) return;
            shownDecision = pending.id;
            Object.keys(answers).forEach(k => delete answers[k]);
            const society = SOCIETIES[pending.society] || pending.society;
            document.getElementById('decisionTitle').textContent = `Décision Amazon · ${society} · ${pending.period}`;
            const n = pending.items.length;
            document.getElementById('decisionIntro').textContent =
                `${n} transaction${n > 1 ? 's' : ''} de ${pending.period} ${n > 1 ? 'ont' : 'a'} besoin de toi.`;
            document.getElementById('decisionRefuse').textContent = '';
            const list = document.getElementById('decisionList');
            list.innerHTML = '';
            pending.items.forEach(item => {
                const tx = document.createElement('div');
                tx.className = 'tx'; tx.dataset.id = item.id;
                tx.innerHTML = `
                    <div class="tx-top"><span class="amt"></span><span class="tx-date"></span></div>
                    <div class="tx-order"></div>
                    <div class="tx-cause"></div>
                    <div class="tx-links"></div>
                    <div class="tx-choices" role="group"></div>`;
                tx.querySelector('.amt').textContent = item.amount;
                tx.querySelector('.tx-date').textContent = 'le ' + item.date;
                tx.querySelector('.tx-order').textContent = item.order ? 'Commande ' + item.order : 'Commande inconnue';
                const cause = tx.querySelector('.tx-cause');
                cause.textContent = item.cause;
                if (item.severity === 'missing') cause.classList.add('missing');
                const links = tx.querySelector('.tx-links');
                [[item.orderUrl, item.order ? 'Voir la commande sur Amazon' : 'Voir mes commandes Amazon'],
                 [item.askUrl, 'Demander une facture']].forEach(([href, label]) => {
                    if (!href) return;
                    const a = document.createElement('a');
                    a.href = href; a.target = '_blank'; a.rel = 'noopener'; a.textContent = label;
                    links.appendChild(a);
                });
                const group = tx.querySelector('.tx-choices');
                group.setAttribute('aria-label', `Choix pour ${item.amount} du ${item.date}`);
                item.choices.forEach(choice => {
                    const b = document.createElement('button');
                    b.type = 'button';
                    b.textContent = pending.labels[choice] || choice;
                    b.setAttribute('aria-pressed', 'false');
                    b.addEventListener('click', () => {
                        answers[item.id] = choice;
                        group.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
                        tx.classList.remove('missing');
                        refreshDecide(pending);
                    });
                    group.appendChild(b);
                });
                list.appendChild(tx);
            });
            refreshDecide(pending);
            document.getElementById('decisionCard').classList.remove('hidden');
            document.getElementById('decisionCard').scrollIntoView({ block: 'nearest' });
        }

        function missingItems(pending) {
            return pending.items.filter(item => !answers[item.id]);
        }

        function refreshDecide(pending) {
            const missing = missingItems(pending);
            document.getElementById('decideBtn').setAttribute('aria-disabled', String(missing.length > 0));
            if (!missing.length) document.getElementById('decisionRefuse').textContent = '';
        }

        document.getElementById('decideBtn').addEventListener('click', async () => {
            const pendingId = shownDecision;
            const list = [...document.querySelectorAll('#decisionList .tx')];
            const missing = list.filter(tx => !answers[tx.dataset.id]);
            if (missing.length) {
                missing.forEach(tx => tx.classList.add('missing'));
                const first = missing[0];
                document.getElementById('decisionRefuse').textContent = missing.length === 1
                    ? `Il manque ton choix pour ${first.querySelector('.amt').textContent} du ${first.querySelector('.tx-date').textContent.replace('le ', '')}.`
                    : `Il manque ton choix pour ${missing.length} transactions (surlignées en rouge).`;
                first.scrollIntoView({ block: 'nearest' });
                return;
            }
            const result = await fetch('/api/decision', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: pendingId, answers: { ...answers } })
            });
            if (result.ok) {
                hideDecision();
            } else {
                const data = await result.json().catch(() => ({}));
                (data.missing || []).forEach(id => {
                    const tx = document.querySelector(`#decisionList .tx[data-id="${id}"]`);
                    if (tx) tx.classList.add('missing');
                });
                document.getElementById('decisionRefuse').textContent = data.error || 'Réponse refusée : un choix manque.';
            }
        });

        function updateUI() {
            document.getElementById('startBtn').disabled = isRunning;
            document.getElementById('stopBtn').disabled = !isRunning;
            monthSelect.disabled = isRunning;

            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');

            if (isRunning) {
                dot.classList.add('running');
                text.textContent = '● En cours...';
            } else {
                dot.classList.remove('running');
                text.textContent = '● Inactif';
            }
        }

        updateUI();
    </script>
</body>
</html>
